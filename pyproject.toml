[project]
name = "idx-engine"
version = "0.1.0"
description = "Direct Indexing Simulator, Statistical Backtester & Web/CLI Workbench"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-2-Clause"
dependencies = [
    "polars>=1.8.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "yfinance>=0.2.44",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
idx-fetch = "idx_engine.cli:run_fetch_cli"
idx-sim = "idx_engine.cli:run_sim_cli"
idx-ui = "idx_engine.cli:run_ui_cli"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true
