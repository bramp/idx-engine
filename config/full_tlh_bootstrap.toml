# Full-constituent direct indexing with TLH evaluated across block-bootstrap paths
save_equity_curves = true
save_lot_details = true

[dataset]
dataset_id = "sp500_synthetic_demo"
version = "latest"

[path]
mode = "block_bootstrap"
horizon_days = 1260
step_days = 21
block_size_days = 21
num_paths = 50
seed = 42

[strategy]
name = "full_direct_tlh"
strategy_type = "direct_index"
allow_fractional = true
tlh_enabled = true
tlh_loss_pct_threshold = "0.05"
tlh_min_loss_dollars = "250"
tlh_check_frequency_days = 5
substitute_mode = "sector_peer"
rebalance_mode = "quarterly"
direct_expense_ratio_bps = "15"
etf_expense_ratio_bps = "3"
lot_policy = "HIFO"

[tax]
fed_st_rate = "0.37"
fed_lt_rate = "0.20"
niit_rate = "0.038"
state_st_rate = "0.093"
state_lt_rate = "0.093"
ordinary_income_offset_cap = "3000"
external_st_gains_annual = "10000"
external_lt_gains_annual = "25000"
tax_settlement_mode = "reinvest_and_pay_from_portfolio"
liquidate_at_end = true

[cashflow]
initial_capital = "500000"
periodic_contribution = "5000"
contribution_frequency_days = 21
